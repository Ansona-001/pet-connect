name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter format / analyze / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: dart format --set-exit-if-changed
        run: dart format --output=none --set-exit-if-changed lib test

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

      - name: flutter build web --release
        run: flutter build web --release

  go:
    name: Go vet / build / test -race
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      GOTELEMETRY: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache-dependency-path: server/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build (all packages, including cmd/api)
        run: go build ./...

      - name: go test -race
        run: go test -race ./...
