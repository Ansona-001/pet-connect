name: petconnect

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petconnect}
      POSTGRES_USER: ${POSTGRES_USER:-petconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petconnect_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - petconnect_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petconnect} -d ${POSTGRES_DB:-petconnect}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - petconnect_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-petconnect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-petconnect_dev_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - petconnect_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-petconnect}:${POSTGRES_PASSWORD:-petconnect_dev}@postgres:5432/${POSTGRES_DB:-petconnect}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-petconnect}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-petconnect_dev_secret}
      S3_BUCKET: petconnect-media
      S3_USE_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-access-secret-before-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret-before-production}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:*;http://127.0.0.1:*}
      DEMO_ASSET_DIR: /app/demo-assets
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./assets/images:/app/demo-assets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  petconnect_postgres:
  petconnect_redis:
  petconnect_minio:
