openapi: 3.1.0
info:
  title: PetConnect API
  version: "0.1.0-baseline"
  description: >
    Contract for the routes that exist in this repository today, generated by reading
    server/cmd/api/main.go and every internal/modules/*/routes.go|handler.go file directly
    (brief §5 Milestone 0 requirement: "version an OpenAPI 3.1 contract for all existing
    routes before changing them"). This is a snapshot, not a target design — endpoints here
    are documented as-built, including known gaps noted inline. Extend this file additively
    as each milestone slice lands; do not retroactively "fix" a documented behavior here
    without also fixing the code and noting the change.
servers:
  - url: http://localhost:8080
    description: Local development (via scripts/run-api.ps1 or docker compose)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived HS256 access token. Not required on /health/*, /auth/*, GET /realtime, and GET /media/uploads/* (the last is a known gap — see description).

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            request_id: { type: string }

    Envelope:
      type: object
      description: 'Every success response is: { "data": <payload> }'
      properties:
        data: {}

    GeoPoint:
      type: object
      description: >
        WARNING — as implemented today this is raw exact latitude/longitude with no
        rounding, on /me, /pets/{petId}, and /events. Traceability matrix flags this
        for the location-privacy pass; do not copy this shape into new endpoints.
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        bio: { type: string }
        city: { type: string }
        profile_photo_url: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        onboarding_completed: { type: boolean }
        onboarding_completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }

    Pet:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        name: { type: string }
        pet_type: { type: string }
        breed: { type: string }
        birth_date: { type: [string, "null"], format: date }
        age_label: { type: string }
        gender: { type: string }
        weight_kg: { type: [number, "null"] }
        bio: { type: string }
        personality: { type: array, items: { type: string } }
        interests: { type: array, items: { type: string } }
        primary_image_url: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        is_verified: { type: boolean }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Post:
      type: object
      description: >
        Single media_url/media_type only — no ordered carousel model exists yet
        (brief target: post_media table, M3).
      properties:
        id: { type: string, format: uuid }
        pet_id: { type: string, format: uuid }
        pet_name: { type: string }
        pet_image_url: { type: string }
        author_user_id: { type: string, format: uuid }
        author_name: { type: string }
        kind: { type: string }
        caption: { type: string }
        location_name: { type: string }
        media_url: { type: string }
        media_type: { type: string }
        visibility: { type: string }
        like_count: { type: integer }
        comment_count: { type: integer }
        liked_by_me: { type: boolean }
        saved_by_me: { type: boolean }
        created_at: { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        author_name: { type: string }
        author_photo_url: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Story:
      type: object
      properties:
        id: { type: string, format: uuid }
        pet_id: { type: string, format: uuid }
        pet_name: { type: string }
        pet_image_url: { type: string }
        author_name: { type: string }
        media_url: { type: string }
        media_type: { type: string }
        text_overlay: { type: object, additionalProperties: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    DiscoveryCandidate:
      type: object
      description: Already privacy-safe — distance_km, not coordinates.
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        owner_name: { type: string }
        name: { type: string }
        pet_type: { type: string }
        breed: { type: string }
        age_label: { type: string }
        gender: { type: string }
        bio: { type: string }
        personality: { type: array, items: { type: string } }
        interests: { type: array, items: { type: string } }
        primary_image_url: { type: string }
        is_verified: { type: boolean }
        distance_km: { type: number }
        follower_count: { type: integer }
        following_by_me: { type: boolean }

    MatchCandidate:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        owner_name: { type: string }
        name: { type: string }
        pet_type: { type: string }
        breed: { type: string }
        age_label: { type: string }
        gender: { type: string }
        bio: { type: string }
        personality: { type: array, items: { type: string } }
        interests: { type: array, items: { type: string } }
        primary_image_url: { type: string }
        distance_km: { type: [number, "null"] }
        is_verified: { type: boolean }

    SwipeResult:
      type: object
      properties:
        swipe_id: { type: string, format: uuid }
        decision: { type: string, enum: [skip, like, super_like] }
        matched: { type: boolean }
        match: { $ref: '#/components/schemas/Match' }

    Match:
      type: object
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        status: { type: string }
        matched_at: { type: string, format: date-time }
        source_pet_id: { type: string, format: uuid }
        source_pet_name: { type: string }
        other_pet_id: { type: string, format: uuid }
        other_pet_name: { type: string }
        other_pet_type: { type: string }
        other_pet_breed: { type: string }
        other_pet_age_label: { type: string }
        other_pet_gender: { type: string }
        other_pet_image_url: { type: string }
        other_owner_id: { type: string, format: uuid }
        other_owner_name: { type: string }

    Chat:
      type: object
      properties:
        id: { type: string, format: uuid }
        match_id: { type: string, format: uuid }
        matched_at: { type: string, format: date-time }
        own_pet_id: { type: string, format: uuid }
        own_pet_name: { type: string }
        other_pet_id: { type: string, format: uuid }
        other_pet_name: { type: string }
        other_pet_type: { type: string }
        other_pet_breed: { type: string }
        other_pet_image_url: { type: string }
        other_owner_id: { type: string, format: uuid }
        other_owner_name: { type: string }
        last_message: { $ref: '#/components/schemas/Message' }
        unread_count: { type: integer }
        last_read_at: { type: [string, "null"], format: date-time }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        sender_user_id: { type: string, format: uuid }
        sender_pet_id: { type: [string, "null"], format: uuid }
        client_message_id:
          type: string
          format: uuid
          description: Client-generated idempotency key — already implemented server-side.
        message_type:
          type: string
          description: Accepted as any string today; not yet validated against a fixed enum.
        body: { type: string }
        media_url: { type: string }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }

    Community:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        owner_name: { type: string }
        name: { type: string }
        description: { type: string }
        emoji: { type: string }
        member_count: { type: integer }
        joined_by_me: { type: boolean }
        my_role: { type: string }
        created_at: { type: string, format: date-time }

    Event:
      type: object
      description: >
        WARNING — latitude/longitude are exact, unrounded coordinates (same class
        of gap as GeoPoint). Flagged for the location-privacy pass.
      properties:
        id: { type: string, format: uuid }
        creator_user_id: { type: string, format: uuid }
        creator_name: { type: string }
        community_id: { type: [string, "null"], format: uuid }
        community_name: { type: string }
        title: { type: string }
        description: { type: string }
        location_name: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        starts_at: { type: string, format: date-time }
        attendee_count: { type: integer }
        my_rsvp: { type: string }
        created_at: { type: string, format: date-time }

    AdoptionListing:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        owner_name: { type: string }
        name: { type: string }
        pet_type: { type: string }
        breed: { type: string }
        age_label: { type: string }
        gender: { type: string }
        description: { type: string }
        city: { type: string }
        image_url: { type: string }
        status: { type: string }
        saved_by_me: { type: boolean }
        save_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    NotificationList:
      type: object
      description: >
        KNOWN GAP — has_more is returned with no next_cursor field anywhere in the
        response. A client cannot page past the first window today. Fix is tracked
        in the traceability matrix (M5 "Notification cursor fix").
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread_count: { type: integer }
        has_more: { type: boolean }

    UploadResult:
      type: object
      properties:
        url: { type: string }
        path: { type: string }
        media_type: { type: string, enum: [image, video, audio] }
        content_type: { type: string }
        size: { type: integer }

paths:
  /health/live:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK }

  /health/ready:
    get:
      summary: Readiness probe (pings Postgres and Redis)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Postgres or Redis unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/register:
    post:
      summary: Register with email/password
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                name: { type: string }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' } ] } } }
        "400": { description: Validation error }
        "409": { description: Email already registered }

  /v1/auth/login:
    post:
      summary: Log in with email/password
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: OK — returns user + token pair }
        "401": { description: Invalid credentials }

  /v1/auth/refresh:
    post:
      summary: Rotate an opaque refresh token for a new access/refresh pair
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: OK — new token pair }
        "401": { description: Invalid or reused refresh token (reuse revokes the token family) }

  /v1/auth/logout:
    post:
      summary: Revoke the current refresh token
      security: []
      description: >
        KNOWN GAP — revokes the refresh token only. Existing access JWTs remain
        valid until natural expiry; open WebSocket connections are not closed.
      responses:
        "204": { description: Logged out }

  /v1/realtime:
    get:
      summary: WebSocket upgrade, authenticated via a single-use ticket query param
      security: []
      parameters:
        - in: query
          name: ticket
          required: true
          schema: { type: string }
      responses:
        "101": { description: Switching Protocols }
        "401": { description: Invalid/expired/already-used ticket }

  /media/demo/{file}:
    get:
      summary: Static demo asset directory
      security: []
      parameters: [ { in: path, name: file, required: true, schema: { type: string } } ]
      responses:
        "200": { description: OK }

  /media/uploads/{key}:
    get:
      summary: Fetch an uploaded media object by its storage key
      security: []
      description: >
        KNOWN GAP — mounted on the public router with no authorization check
        (server/internal/modules/media/handler.go download is registered via
        `public.Get`). Anyone with the URL can fetch any object. Safe today only
        because every current upload is effectively public content; must move
        behind auth/signed URLs before private media exists.
      parameters: [ { in: path, name: key, required: true, schema: { type: string } } ]
      responses:
        "200": { description: OK }
        "404": { description: Not found }

  /v1/me:
    get:
      summary: Get the authenticated owner's profile
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } } }
    patch:
      summary: Update the authenticated owner's profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                bio: { type: string }
                city: { type: string }
                profile_photo_url: { type: string }
                location: { $ref: '#/components/schemas/GeoPoint' }
                clear_location: { type: boolean }
                complete_onboarding: { type: boolean }
      responses:
        "200": { description: OK }
        "400": { description: Validation error }

  /v1/me/pets:
    get:
      summary: List the authenticated owner's pets
      responses:
        "200": { description: OK }
    post:
      summary: Create a pet owned by the authenticated user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, pet_type]
              properties:
                name: { type: string }
                pet_type: { type: string }
                breed: { type: string }
                birth_date: { type: [string, "null"], format: date }
                age_label: { type: string }
                gender: { type: string }
                weight_kg: { type: [number, "null"] }
                bio: { type: string }
                personality: { type: array, items: { type: string } }
                interests: { type: array, items: { type: string } }
                primary_image_url: { type: string }
                location: { $ref: '#/components/schemas/GeoPoint' }
      responses:
        "201": { description: Created }

  /v1/pets/{petId}:
    parameters: [ { in: path, name: petId, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Get a pet by id
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Pet' } } } } }
        "404": { description: Not found }
    patch:
      summary: Update a pet (owner only)
      responses:
        "200": { description: OK }
        "403": { description: Not the pet's owner }
    delete:
      summary: Delete a pet (owner only)
      responses:
        "204": { description: Deleted }
        "403": { description: Not the pet's owner }

  /v1/feed:
    get:
      summary: Cursor-paginated home feed
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200": { description: OK }

  /v1/posts:
    post:
      summary: Create a post (single media item)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pet_id, media_url, media_type]
              properties:
                pet_id: { type: string, format: uuid }
                caption: { type: string }
                location_name: { type: string }
                media_url: { type: string }
                media_type: { type: string }
                visibility: { type: string }
      responses:
        "201": { description: Created }

  /v1/posts/{postId}/like:
    parameters: [ { in: path, name: postId, required: true, schema: { type: string, format: uuid } } ]
    put:
      summary: Like a post (idempotent)
      responses: { "204": { description: Liked } }
    delete:
      summary: Unlike a post (idempotent)
      responses: { "204": { description: Unliked } }

  /v1/posts/{postId}/save:
    parameters: [ { in: path, name: postId, required: true, schema: { type: string, format: uuid } } ]
    put:
      summary: Save a post (idempotent)
      responses: { "204": { description: Saved } }
    delete:
      summary: Unsave a post (idempotent)
      responses: { "204": { description: Unsaved } }

  /v1/posts/{postId}/comments:
    parameters: [ { in: path, name: postId, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: List comments (no edit/delete endpoints exist yet)
      responses: { "200": { description: OK } }
    post:
      summary: Create a comment
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string } } }
      responses: { "201": { description: Created } }

  /v1/stories:
    get:
      summary: List active stories
      responses: { "200": { description: OK } }
    post:
      summary: Create a story
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pet_id, media_url, media_type]
              properties:
                pet_id: { type: string, format: uuid }
                media_url: { type: string }
                media_type: { type: string }
                text_overlay: { type: object, additionalProperties: true }
      responses: { "201": { description: Created } }

  /v1/reels:
    get:
      summary: List reels (reuses the posts table/schema, filtered — not a distinct model)
      responses: { "200": { description: OK } }
    post:
      summary: Create a reel (same request shape as POST /v1/posts)
      responses: { "201": { description: Created } }

  /v1/discovery/pets:
    get:
      summary: Nearby pet discovery (PostGIS-backed, returns distance_km not coordinates)
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DiscoveryCandidate' } }, next_cursor: { type: string } } } } } } }

  /v1/pets/{petId}/candidates:
    parameters: [ { in: path, name: petId, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Match candidates for a given pet
      description: >
        Distinct endpoint/filter surface from /v1/discovery/pets covering an overlapping
        concept — brief M4 calls for consolidating or clearly separating these.
      responses: { "200": { description: OK } }

  /v1/pets/{petId}/swipes:
    parameters: [ { in: path, name: petId, required: true, schema: { type: string, format: uuid } } ]
    post:
      summary: Record a swipe decision; reciprocal likes create exactly one match+chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_pet_id, decision, client_request_id]
              properties:
                target_pet_id: { type: string, format: uuid }
                decision: { type: string, enum: [skip, like, super_like] }
                client_request_id:
                  type: string
                  format: uuid
                  description: Idempotency key — already enforced server-side.
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/SwipeResult' } } } } }

  /v1/matches:
    get:
      summary: List the authenticated user's matches
      responses: { "200": { description: OK } }

  /v1/chats:
    get:
      summary: List chats for the authenticated user
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Chat' } } } } } }

  /v1/chats/{chatId}/messages:
    parameters: [ { in: path, name: chatId, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: List messages in a chat (cursor-paginated)
      responses: { "200": { description: OK } }
    post:
      summary: Send a message (idempotent via client_message_id)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [client_message_id, message_type]
              properties:
                sender_pet_id: { type: [string, "null"], format: uuid }
                client_message_id: { type: string, format: uuid }
                message_type:
                  type: string
                  description: Accepted as any string today — not validated against a fixed enum server-side.
                body: { type: string }
                media_url: { type: string }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Message' } } } } }

  /v1/chats/{chatId}/read:
    parameters: [ { in: path, name: chatId, required: true, schema: { type: string, format: uuid } } ]
    put:
      summary: Mark a chat read up to a message
      responses: { "204": { description: Read } }

  /v1/communities:
    get:
      summary: List communities
      responses: { "200": { description: OK } }
    post:
      summary: Create a community
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                emoji: { type: string }
      responses: { "201": { description: Created } }

  /v1/communities/{communityId}/members/me:
    parameters: [ { in: path, name: communityId, required: true, schema: { type: string, format: uuid } } ]
    put:
      summary: Join a community
      responses: { "204": { description: Joined } }
    delete:
      summary: Leave a community
      responses: { "204": { description: Left } }

  /v1/events:
    get:
      summary: List events
      responses: { "200": { description: OK } }
    post:
      summary: Create an event
      description: Accepts exact latitude/longitude — see Event schema warning.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at]
              properties:
                community_id: { type: [string, "null"], format: uuid }
                title: { type: string }
                description: { type: string }
                location_name: { type: string }
                latitude: { type: [number, "null"] }
                longitude: { type: [number, "null"] }
                starts_at: { type: string, format: date-time }
      responses: { "201": { description: Created } }

  /v1/events/{eventId}/rsvps/me:
    parameters: [ { in: path, name: eventId, required: true, schema: { type: string, format: uuid } } ]
    put:
      summary: Set the authenticated user's RSVP status
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string } } }
      responses: { "204": { description: RSVP set } }
    delete:
      summary: Remove the authenticated user's RSVP
      responses: { "204": { description: RSVP removed } }

  /v1/adoptions:
    get:
      summary: List adoption listings
      responses: { "200": { description: OK } }
    post:
      summary: Create an adoption listing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, pet_type]
              properties:
                name: { type: string }
                pet_type: { type: string }
                breed: { type: string }
                age_label: { type: string }
                gender: { type: string }
                description: { type: string }
                city: { type: string }
                image_url: { type: string }
      responses: { "201": { description: Created } }

  /v1/adoptions/{listingId}/save:
    parameters: [ { in: path, name: listingId, required: true, schema: { type: string, format: uuid } } ]
    put:
      summary: Save a listing
      responses: { "204": { description: Saved } }
    delete:
      summary: Unsave a listing
      responses: { "204": { description: Unsaved } }

  /v1/notifications:
    get:
      summary: List notifications
      description: See NotificationList schema — has_more with no working next_cursor today.
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/NotificationList' } } } } }

  /v1/notifications/read-all:
    put:
      summary: Mark all notifications read
      responses: { "200": { description: OK } }

  /v1/notifications/{notificationId}/read:
    parameters: [ { in: path, name: notificationId, required: true, schema: { type: string, format: uuid } } ]
    put:
      summary: Mark one notification read
      responses: { "204": { description: Read } }

  /v1/media/uploads:
    post:
      summary: Upload a media file
      description: >
        KNOWN GAP — validates only the client-supplied Content-Type header against
        an allowlist; no magic-byte sniffing, re-encoding, EXIF stripping, or
        malware scan happens server-side today.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/UploadResult' } } } } }
        "413": { description: File too large or empty }
        "415": { description: Unsupported content type }

  /v1/realtime/tickets:
    post:
      summary: Issue a single-use WebSocket ticket bound to the current access token
      responses: { "201": { description: Created } }
